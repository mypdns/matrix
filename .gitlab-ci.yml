image: ubuntu:latest

stages:
  - build
  - import
  - push

# Only run scheduled pipelines for the import job
#workflow:
#  rules:
#    - if: '$CI_PIPELINE_SOURCE == "schedule"'
#      when: always
#    - when: never

variables:
  GIT_DEPTH: "2"
  DEBIAN_FRONTEND: "noninteractive"

default:
  before_script:
    - apt-get update
    - apt-get install -yqq bash git python3 python3-venv python3-pip ca-certificates curl
    - git config --global user.email "${GITLAB_USER_EMAIL:-ci@example.com}"
    - git config --global user.name  "${GIT_USER_NAME:-CI Bot}"
    - python3 -m venv .venv
    - . .venv/bin/activate
    - pip install --upgrade pip
    - if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install -q mypdns; fi

# Keep your existing behavior: run on merge to master, sort CSVs, commit back to master.
# This job is NOT part of the scheduled-only workflow (so it will run on master updates).
sort_lists_master:
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"'
      when: on_success
    - when: never
  script:
    - git fetch origin "$CI_DEFAULT_BRANCH"
    - git checkout "$CI_DEFAULT_BRANCH"

    - echo "Target file (expected to be sorted):"
    - ls -lhA "$CI_PROJECT_DIR/source/porn_filters/explicit_content/wildcard.csv" || true
    - sha256sum "$CI_PROJECT_DIR/source/porn_filters/explicit_content/wildcard.csv" || true

    - echo "Running sort_lists.sh ..."
    - bash "$CI_PROJECT_DIR/tools/sort_lists.sh"

    - echo "After run:"
    - ls -lhA "$CI_PROJECT_DIR/source/porn_filters/explicit_content/wildcard.csv" || true
    - sha256sum "$CI_PROJECT_DIR/source/porn_filters/explicit_content/wildcard.csv" || true

    - echo "Git status:"
    - git status

    - echo "Diff summary (no add):"
    - git diff --name-only
    - git diff --stat

    - git add -A
    - |
      if git diff --cached --quiet; then
        echo "No changes staged; sort_lists.sh likely made no modifications (or modified untracked files / wrong path)."
        exit 0
      fi

    - git config user.email "${GIT_EMAIL}"
    - git config user.name  "${GIT_NAME}"
    - tag="$(date +'%d %b %Y %H:%M:%S')"
    - git commit -m "Sorted CSV database files ($tag)"

    - git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_DEFAULT_BRANCH}" -o skip-ci


# Only on schedule: import ShadowWhisperer, commit back to master.
shadowwhisperer_import:
  stage: import
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
    - when: never
  script:
    - git fetch origin "$CI_DEFAULT_BRANCH"
    - git checkout "$CI_DEFAULT_BRANCH"

    - echo "Before:"
    - ls -lhA "$CI_PROJECT_DIR/source/porn_filters/imported" || true

    - bash "$CI_PROJECT_DIR/scripts/shadowwhisperer.sh"

    - echo "After:"
    - ls -lhA "$CI_PROJECT_DIR/source/porn_filters/imported" || true

    - git add -A
    - |
      if git diff --cached --quiet; then
        echo "No changes to commit."
        exit 0
      fi

    - tag="$(date +'%d %b %Y %H:%M:%S')"
    - git commit -m "Updated ShadowWhisperer's pornfilters $tag"

    - git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_DEFAULT_BRANCH}" -o skip-ci

shadowwhisperer_mirror_notify:
  stage: push
  needs: [ "shadowwhisperer_import" ]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
    - when: never
  script:
    - >
      curl -sS -X POST
      -H "Authorization: token ${GH_TOKEN}"
      -H "Accept: application/vnd.github+json"
      "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches"
      -d '{"event_type":"shadowwhisperer.updated"}'
