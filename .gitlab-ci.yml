image: ubuntu:latest

stages:
  - build
  - import
  - push

variables:
  GIT_DEPTH: "2"
  DEBIAN_FRONTEND: "noninteractive"

default:
  before_script:
    - apt-get update
    - apt-get install -yqq bash git python3 python3-venv python3-pip ca-certificates curl
    - git config --global user.email "${GITLAB_USER_EMAIL:-ci@framagit.org}"
    - git config --global user.name  "${GIT_USER_NAME:-CI Bot}"
    - python3 -m venv .venv
    - . .venv/bin/activate
    - pip install --upgrade pip
    - if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install -q mypdns; fi
    - tag="$(date +'%d %b %Y %H:%M:%S')"

sort_lists_master:
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"'
      when: on_success
    - when: never
  script:
    - git fetch origin "$CI_DEFAULT_BRANCH"
    - git checkout "$CI_DEFAULT_BRANCH"
    - git reset --hard "origin/$CI_DEFAULT_BRANCH"   # force local master to match remote tip

    - bash "$CI_PROJECT_DIR/tools/sort_lists.sh"

    - git add -A
    - |
      if git diff --cached --quiet; then
        echo "No changes to commit after rebase."
        exit 0
      else
        git commit -m "Updated ShadowWhisperer's pornfilters $tag"
        git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_DEFAULT_BRANCH}" -o skip-ci
      fi

shadowwhisperer_import:
  stage: import
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
    - when: never
  script:
    - git fetch origin "$CI_DEFAULT_BRANCH"
    - git checkout "$CI_DEFAULT_BRANCH"
    - git reset --hard "origin/$CI_DEFAULT_BRANCH"   # force local master to match remote tip

    - bash "$CI_PROJECT_DIR/scripts/shadowwhisperer.sh"

    - git add -A
    - |
      if git diff --cached --quiet; then
        echo "No changes to commit."
        exit 0
      else
        git commit -m "Updated ShadowWhisperer's pornfilters $tag"
        git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_DEFAULT_BRANCH}" -o skip-ci
      fi
